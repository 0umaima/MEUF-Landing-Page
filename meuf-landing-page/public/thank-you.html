<!doctype html><html lang="ar-MA" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>MEUF — الطلب</title><link rel="icon" href="assets/images/favicon.png"><link rel="stylesheet" href="css/style.css"></head><body><main class="success-page"><img src="assets/images/logo.png" alt="MEUF" width="140" style="margin:auto"><div class="success-mark" id="mark" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m5 12 4 4L19 6"/></svg></div><h1 id="title">معلومات الطلب</h1><p id="message">رجعي لصفحة المنتج باش تكملي الطلب.</p><p id="reference" dir="ltr"></p><a href="./" class="button primary">الرجوع للمنتج</a></main><script type="module">const demo=new URLSearchParams(location.search).get('demo')==='1';let id;try{id=sessionStorage.getItem('meuf_order_success')}catch{}if(demo){document.querySelector('#title').textContent='تجربة ناجحة';document.querySelector('#message').textContent='هذا طلب تجريبي فقط. لم يتم إرسال أي معلومات.';}else if(id){document.querySelector('#mark').hidden=false;document.querySelector('#title').textContent='توصلنا بطلبك';document.querySelector('#message').textContent='شكراً على ثقتك. غادي نتاصلو بيك ف أقرب وقت باش نأكدو الطلب.';document.querySelector('#reference').textContent=id;}</script></body></html>
